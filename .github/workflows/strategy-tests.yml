name: Gold Hunter strategy safety tests

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/strategy.ts'
      - 'supabase/functions/_shared/strategy_test.ts'
      - '.github/workflows/strategy-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strategy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run strategy and risk-sizing tests
        run: deno test --no-check supabase/functions/_shared/strategy_test.ts
