name: Deploy cTrader OAuth Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-ctrader-oauth.yml'
  workflow_dispatch:

concurrency:
  group: gold-hunter-backend-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check cTrader Edge Functions
        run: |
          deno check supabase/functions/ctrader-oauth-start/index.ts
          deno check supabase/functions/ctrader-oauth-callback/index.ts
          deno check supabase/functions/ctrader-accounts/index.ts
          deno check supabase/functions/ctrader-market-data/index.ts
          deno check supabase/functions/ctrader-auto-trader/index.ts

      - name: Test strategy and cash-risk safeguards
        run: deno test supabase/functions/_shared/strategy_test.ts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy cTrader OAuth start function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN" && exit 1)
          npx --yes supabase@latest functions deploy ctrader-oauth-start --project-ref onrajhrabqtotiedgsxh --yes

      - name: Deploy cTrader OAuth callback function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@latest functions deploy ctrader-oauth-callback --project-ref onrajhrabqtotiedgsxh --yes

      - name: Deploy authenticated cTrader account discovery function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@latest functions deploy ctrader-accounts --project-ref onrajhrabqtotiedgsxh --yes

      - name: Deploy authenticated cTrader market data function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@latest functions deploy ctrader-market-data --project-ref onrajhrabqtotiedgsxh --yes

      - name: Deploy scheduled demo auto-trader
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@latest functions deploy ctrader-auto-trader --project-ref onrajhrabqtotiedgsxh --yes
