name: Gold Hunter AI Android APK

on:
  # APK builds are manual only until backend and demo execution are verified.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Align Expo SDK dependencies
        run: npx expo install --fix

      - name: TypeScript check
        run: npm run typecheck

      - name: Verify Expo Android export
        run: npx expo export --platform android

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Embed production JavaScript bundle into Android assets
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/res
          npx expo export:embed --platform android --dev false --entry-file node_modules/expo-router/entry --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
          test -s android/app/src/main/assets/index.android.bundle
          echo "Production Android bundle created: $(du -h android/app/src/main/assets/index.android.bundle | cut -f1)"

      - name: Diagnose Expo Android module metadata
        run: |
          npx expo-modules-autolinking resolve --platform android --json > /tmp/expo-autolinking.json
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/expo-autolinking.json","utf8")); console.log(JSON.stringify((x.modules||[]).map((m,i)=>({index:i,name:m.packageName||m.name,projects:m.projects?.map(p=>({name:p.name,publication:p.publication}))})),null,2))'

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK contains offline JavaScript bundle
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'assets/index.android.bundle'
          unzip -p "$APK" assets/index.android.bundle | head -c 1 | grep -q .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gold-hunter-ai-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
