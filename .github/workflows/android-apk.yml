name: Gold Hunter AI Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Align Expo SDK dependencies
        run: npx expo install --fix

      - name: TypeScript check
        run: npm run typecheck

      - name: Verify Expo Android export
        run: npx expo export --platform android

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Diagnose Expo Android module metadata
        run: |
          npx expo-modules-autolinking resolve --platform android > /tmp/expo-autolinking.json
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/expo-autolinking.json","utf8")); console.log(JSON.stringify((x.modules||[]).map((m,i)=>({index:i,name:m.packageName||m.name,projects:m.projects?.map(p=>({name:p.name,publication:p.publication}))})),null,2))'

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gold-hunter-ai-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
